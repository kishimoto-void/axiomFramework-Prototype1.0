[package]
name = "axiom-plp-capsule"
version = "1.3.0"
edition.workspace = true
license-file.workspace = true
description = "PLP Capsule v1.3.0 — Production-Ready Reference Implementation (streaming hash, observers, delta)"
publish = false

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
ryu = { workspace = true }
itoa = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }

[features]
default = ["sha2-hash"]
sha2-hash = ["sha2"]
blake3-hash = ["blake3"]
