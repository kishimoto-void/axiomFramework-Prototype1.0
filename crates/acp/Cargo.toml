[package]
name = "axiom-acp"
version = "1.2.0"
edition.workspace = true
license-file.workspace = true
description = "AXIOM Common Protocol (ACP) v1.2.0 — Production Reference (Research License)"
publish = false

[features]
default = ["std"]
std = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ryu = { workspace = true }
time = { version = "0.3", default-features = false, features = ["parsing", "formatting", "std"] }
axiom-capsule = { path = "../capsule" }
