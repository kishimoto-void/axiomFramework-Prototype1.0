[workspace]
resolver = "2"
members = [
    "crates/pss",
    "crates/plp",
    "crates/capsule",
    "crates/acp",
    "crates/dck",
    "crates/runtime",
    "crates/lrp",
    "crates/plp-capsule",
    "crates/pss-spec",
]
default-members = ["crates/runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Root LICENSE = AXIOM Framework Research License v1.0
# MIT components: axiom-pss, axiom-pss-spec, axiom-dck (see each crate LICENSE-MIT)
# Research License: ACP, PLP, Capsule, LRP, Runtime, plp-capsule
license-file = "LICENSE"
authors = ["kishimoto-void"]
repository = "https://github.com/kishimoto-void/axiomFramework-Prototype1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
im = { version = "15", features = ["serde"] }
ryu = "1"
itoa = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
time = { version = "0.3", default-features = false, features = ["parsing", "formatting"] }
